# ネイティブLinux + NVIDIA実GPU向けのGPUパススルー。nvidia-container-toolkit経由で
# NVIDIAのネイティブOpenGL/GLXドライバをそのまま使う(WSL2のようなd3d12変換層は不要)。
# ホスト側に `nvidia-ctk runtime configure --runtime=docker` 済みであることが前提。
services:
  edge:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      # ネイティブLinuxのXorgはアクセス制御が有効で、xhost +local:rootだと
      # X11再起動等で許可がリセットされ再発するため、ホストの実際のXauthorityファイルを
      # そのまま渡す(WSLgは通常アクセス制御が緩く、この対応は不要)。
      - XAUTHORITY=${XAUTHORITY}
    volumes:
      - ${XAUTHORITY}:${XAUTHORITY}:ro
