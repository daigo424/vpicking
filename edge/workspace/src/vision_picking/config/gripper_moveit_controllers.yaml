# moveit_resources_panda_moveit_config同梱のgripper_moveit_controllers.yamlのコピーをベースに、
# allowed_start_toleranceだけ緩める。Isaac Sim -> ros2_control -> joint_state_broadcaster ->
# moveit_pyという複数ホップの状態フィードバック経路には、実機の直結controllerより
# 反映までの遅延が乗りやすく、既定の0.01(rad)だと直前の動作が完全に静止した直後でも
# 「計画時の開始状態と実行時の現在状態がズレている」と判定され、軌道の実行そのものが
# 拒否されることがある。
trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.05

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - panda_arm_controller
    - panda_hand_controller

  panda_arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7

  panda_hand_controller:
    action_ns: gripper_cmd
    type: GripperCommand
    default: true
    joints:
      - panda_finger_joint1
